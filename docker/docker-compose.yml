# Local services for development. Ports are bound to this computer only.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vf, POSTGRES_PASSWORD: vf, POSTGRES_DB: vf }
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U vf'], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['127.0.0.1:6379:6379']
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin, MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3001' }
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
  clamav:
    image: clamav/clamav:1.4
    ports: ['127.0.0.1:3310:3310']
    profiles: [scan]
volumes: { postgres_data: {}, minio_data: {} }
