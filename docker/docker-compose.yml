# Local services for development. Ports are bound to this computer only.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vf, POSTGRES_PASSWORD: vf, POSTGRES_DB: vf }
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:5432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U vf'], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports: ['127.0.0.1:6379:6379']
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  # Local stand-in for S3. It does not check signatures, so never expose it.
  s3:
    image: adobe/s3mock:4.7.0
    environment: { COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: files }
    ports: ['127.0.0.1:9090:9090']
  clamav:
    image: clamav/clamav:1.4
    ports: ['127.0.0.1:3310:3310']
    profiles: [scan]
volumes: { postgres_data: {} }
