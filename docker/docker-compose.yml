version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vashundhara-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vashundhara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vashundhara}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vashundhara} -d ${POSTGRES_DB:-vashundhara}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vashundhara-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    container_name: vashundhara-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vashundhara-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # API Backend (NestJS)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: vashundhara-api
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api
      API_VERSION: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-vashundhara}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vashundhara}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-better-auth-secret-change-in-production}
      BETTER_AUTH_URL: http://localhost:3000
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      CORS_ORIGIN: http://localhost:3001,http://localhost:3002
      LOG_LEVEL: debug
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - /app/apps/api/node_modules
      - /app/packages/*/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vashundhara-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Web Frontend (Next.js)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: development
    container_name: vashundhara-web
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/*/node_modules
    ports:
      - "3001:3001"
    depends_on:
      - api
    networks:
      - vashundhara-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Admin Dashboard (Next.js)
  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      target: development
    container_name: vashundhara-admin
    environment:
      NODE_ENV: development
      PORT: 3002
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3002
    volumes:
      - ../apps/admin:/app/apps/admin
      - ../packages:/app/packages
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next
      - /app/packages/*/node_modules
    ports:
      - "3002:3002"
    depends_on:
      - api
    networks:
      - vashundhara-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Documentation (Next.js)
  docs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.docs
      target: development
    container_name: vashundhara-docs
    environment:
      NODE_ENV: development
      PORT: 3003
    volumes:
      - ../apps/docs:/app/apps/docs
      - /app/apps/docs/node_modules
      - /app/apps/docs/.next
    ports:
      - "3003:3003"
    networks:
      - vashundhara-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Prisma Studio (Database GUI)
  prisma-studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: vashundhara-prisma-studio
    command: npx prisma studio --port 5555 --hostname 0.0.0.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vashundhara}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-vashundhara}?schema=public
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vashundhara-network
    profiles:
      - tools

  # Mailhog (Email testing)
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: vashundhara-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - vashundhara-network
    profiles:
      - tools

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: vashundhara-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vashundhara-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  vashundhara-network:
    driver: bridge
    name: vashundhara-network