apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vf-staging
resources: [../../base, ingress.yaml]
images:
  - { name: vf-api, newName: ghcr.io/echelonxventures-projects/vashundhara_foundation/api, newTag: replace-me }
  - { name: vf-web, newName: ghcr.io/echelonxventures-projects/vashundhara_foundation/web, newTag: replace-me }
  - { name: vf-admin, newName: ghcr.io/echelonxventures-projects/vashundhara_foundation/admin, newTag: replace-me }
  - { name: vf-docs, newName: ghcr.io/echelonxventures-projects/vashundhara_foundation/docs, newTag: replace-me }
patches:
  - target: { kind: ConfigMap, name: vf-config }
    patch: |-
      - { op: replace, path: /data/ROOT_DOMAIN, value: staging.vashundharafoundation.org }
      - { op: replace, path: /data/APP_URL, value: 'https://staging.vashundharafoundation.org' }
      - { op: replace, path: /data/CORS_ORIGIN, value: 'https://staging.vashundharafoundation.org,https://admin.staging.vashundharafoundation.org' }
      - { op: replace, path: /data/EMAIL_FROM, value: 'no-reply@staging.vashundharafoundation.org' }
