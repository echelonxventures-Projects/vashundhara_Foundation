apiVersion: apps/v1
kind: Deployment
metadata: { name: web, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  strategy: { rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: web
          image: vf-web
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          ports: [{ containerPort: 3000, name: http }]
          envFrom: [{ configMapRef: { name: vf-config } }, { secretRef: { name: vf-web-secrets } }]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 1Gi } }
          startupProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 3, failureThreshold: 40 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web }
spec: { minAvailable: 1, selector: { matchLabels: { app: web } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
