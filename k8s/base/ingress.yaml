apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vashundhara-ingress
  namespace: vashundhara
  labels:
    app: vashundhara
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-rpm: "1000"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.vashundharafoundation.org
    - app.vashundharafoundation.org
    - admin.vashundharafoundation.org
    - docs.vashundharafoundation.org
    secretName: vashundhara-tls
  rules:
  # API subdomain
  - host: api.vashundharafoundation.org
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000

  # Web app (main user-facing app)
  - host: app.vashundharafoundation.org
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3001

  # Admin dashboard
  - host: admin.vashundharafoundation.org
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3000
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 3002

  # Documentation
  - host: docs.vashundharafoundation.org
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: docs
            port:
              number: 3003

  # Root domain - redirect to app
  - host: vashundharafoundation.org
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3001