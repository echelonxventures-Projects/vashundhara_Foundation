apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: vashundhara
  labels:
    app: docs
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
        component: frontend
    spec:
      containers:
      - name: docs
        image: ghcr.io/echelonxventures/vashundhara-foundation/docs:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
          name: http
        envFrom:
        - configMapRef:
            name: vashundhara-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: vashundhara
  labels:
    app: docs
spec:
  type: ClusterIP
  ports:
  - port: 3003
    targetPort: 3003
    name: http
  selector:
    app: docs