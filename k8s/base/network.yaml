apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: from-ingress }
spec:
  podSelector: { matchExpressions: [{ key: app, operator: In, values: [web, admin, docs, api] }] }
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }], ports: [{ port: 3000 }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: to-api }
spec:
  podSelector: { matchLabels: { app: api } }
  ingress: [{ from: [{ podSelector: { matchExpressions: [{ key: app, operator: In, values: [web, admin] }] } }], ports: [{ port: 3000 }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: to-clamav }
spec:
  podSelector: { matchLabels: { app: clamav } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app: worker } } }], ports: [{ port: 3310 }] }]
