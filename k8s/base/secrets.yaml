apiVersion: v1
kind: Secret
metadata:
  name: vashundhara-secrets
  namespace: vashundhara
  labels:
    app: vashundhara
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://vashundhara:CHANGE_ME@postgres:5432/vashundhara?schema=public"
  POSTGRES_USER: "vashundhara"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "vashundhara"

  # Redis
  REDIS_URL: "redis://redis:6379"

  # Auth
  JWT_SECRET: "CHANGE_ME_MIN_32_CHARS"
  BETTER_AUTH_SECRET: "CHANGE_ME_MIN_32_CHARS"
  BETTER_AUTH_URL: "https://api.vashundharafoundation.org"

  # External APIs
  EXCHANGE_RATE_API_KEY: "CHANGE_ME"

  # Email (optional)
  SENDGRID_API_KEY: ""
  MAILGUN_API_KEY: ""
  MAILGUN_DOMAIN: ""

  # SMS (optional)
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_PHONE_NUMBER: ""

  # Storage (optional)
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_S3_BUCKET: ""
  AWS_S3_REGION: ""

  # Monitoring (optional)
  SENTRY_DSN: ""
  DATADOG_API_KEY: ""