name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================
  # LINT & TYPECHECK
  # ============================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format --check

  # ============================================
  # UNIT TESTS
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vashundhara_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-testing-only
          BETTER_AUTH_SECRET: test-secret-key-for-testing-only
          BETTER_AUTH_URL: http://localhost:3000

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ============================================
  # E2E TESTS
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vashundhara_test
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vashundhara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm db:migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vashundhara_test

      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vashundhara_test

      - name: Build applications
        run: pnpm build

      - name: Start API server
        run: |
          cd apps/api
          pnpm start:prod &
          sleep 10
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vashundhara_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-for-testing-only
          BETTER_AUTH_SECRET: test-secret-key-for-testing-only
          BETTER_AUTH_URL: http://localhost:3000
          PORT: 3000

      - name: Start Web server
        run: |
          cd apps/web
          pnpm start &
          sleep 10
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PORT: 3001

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          API_URL: http://localhost:3000

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/test-results/
            apps/api/test-results/
          retention-days: 7

  # ============================================
  # BUILD DOCKER IMAGES
  # ============================================
  build-images:
    name: Build Docker Images
    needs: [lint-and-typecheck, unit-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web, admin, docs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runner
          platforms: linux/amd64,linux/arm64

  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-images, e2e-tests]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Deploy to staging
        run: |
          kubectl set image deployment/api api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest -n vashundhara-staging
          kubectl set image deployment/web web=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest -n vashundhara-staging
          kubectl set image deployment/admin admin=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin:latest -n vashundhara-staging
          kubectl set image deployment/docs docs=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/docs:latest -n vashundhara-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n vashundhara-staging --timeout=300s
          kubectl rollout status deployment/web -n vashundhara-staging --timeout=300s
          kubectl rollout status deployment/admin -n vashundhara-staging --timeout=300s
          kubectl rollout status deployment/docs -n vashundhara-staging --timeout=300s

      - name: Run smoke tests
        run: |
          curl -f https://api.staging.vashundharafoundation.org/health
          curl -f https://app.staging.vashundharafoundation.org/health

  # ============================================
  # DEPLOY TO PRODUCTION
  # ============================================
  deploy-production:
    name: Deploy to Production
    needs: [build-images, e2e-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PROD }}

      - name: Deploy to production
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          kubectl set image deployment/api api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${VERSION} -n vashundhara
          kubectl set image deployment/web web=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${VERSION} -n vashundhara
          kubectl set image deployment/admin admin=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin:${VERSION} -n vashundhara
          kubectl set image deployment/docs docs=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/docs:${VERSION} -n vashundhara

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n vashundhara --timeout=300s
          kubectl rollout status deployment/web -n vashundhara --timeout=300s
          kubectl rollout status deployment/admin -n vashundhara --timeout=300s
          kubectl rollout status deployment/docs -n vashundhara --timeout=300s

      - name: Run smoke tests
        run: |
          curl -f https://api.vashundharafoundation.org/health
          curl -f https://app.vashundharafoundation.org/health
          curl -f https://admin.vashundharafoundation.org/health

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true